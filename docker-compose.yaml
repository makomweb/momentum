services:
  app:
    build:
      context: .
      dockerfile: build/Dockerfile.app
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://root:secret@db:3306/app?serverVersion=8.4&charset=utf8mb4"
    networks:
      - run-forge

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - run-forge

  composer:
    build:
      context: .
      dockerfile: build/Dockerfile.composer
    volumes:
      - ./app:/app
    depends_on:
      - db
    networks:
      - run-forge
    
  db-admin:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
    #restart: always
    ports:
      - "8085:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - run-forge

volumes:
  db_data:

networks:
  run-forge:
    driver: bridge
