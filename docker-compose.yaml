services:
  app:
    build:
      context: .
      dockerfile: build/Dockerfile.app
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - momentum

  db:
    image: mysql:8.4
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - momentum

  composer:
    build:
      context: .
      dockerfile: build/Dockerfile.composer
    volumes:
      - ./app:/app
    depends_on:
      - db
    networks:
      - momentum
    
  cache:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - momentum

  db-admin:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
    #restart: always
    ports:
      - "8085:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - momentum

  worker:
    build:
      context: .
      dockerfile: build/Dockerfile.worker
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - momentum
    restart: unless-stopped

  dashboard:
    image: b4bz/homer:latest
    volumes:
      - ./dashboard/assets:/www/assets
    ports:
      - "8000:8080"
    restart: unless-stopped
    networks:
      - momentum

  mkdocs:
    build:
      context: .
      dockerfile: build/Dockerfile.mkdocs
    ports:
      - "8005:8000"
    volumes:
      - ./mkdocs:/docs
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - momentum

volumes:
  db_data:

networks:
  momentum:
    driver: bridge
