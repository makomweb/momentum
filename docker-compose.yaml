services:
  app:
    build:
      context: .
      dockerfile: build/Dockerfile.app
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: "dev"
      DATABASE_URL: "mysql://root:secret@db:3306/app?serverVersion=8.4&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?table_name=messenger_messages&queue_name=default"
    networks:
      - momentum

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - momentum

  composer:
    build:
      context: .
      dockerfile: build/Dockerfile.composer
    volumes:
      - ./app:/app
    depends_on:
      - db
    networks:
      - momentum
    
  db-admin:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
    #restart: always
    ports:
      - "8085:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - momentum

  worker:
    build:
      context: .
      dockerfile: build/Dockerfile.worker
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: "dev"
      DATABASE_URL: "mysql://root:secret@db:3306/app?serverVersion=8.4&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "doctrine://default?table_name=messenger_messages&queue_name=default"
    networks:
      - momentum
    restart: unless-stopped

  dashboard:
    image: b4bz/homer:latest
    volumes:
      - ./dashboard/assets:/www/assets
    ports:
      - "8000:8080"
    restart: unless-stopped
    networks:
      - momentum

  mkdocs:
    image: squidfunk/mkdocs-material:latest
    ports:
      - "8005:8000"
    volumes:
      - ./mkdocs:/docs
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - momentum

volumes:
  db_data:

networks:
  momentum:
    driver: bridge
