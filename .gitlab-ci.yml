stages:
  - dependencies
  - qa
  - delivery

variables:
  # Use plain TCP to docker:dind in GitLab SaaS runners (buildx otherwise fails with TLS env context)
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: "makomweb/momentum"
  IMAGE_PLATFORMS: "linux/amd64"

# Install dependencies with composer
composer-install:
  stage: dependencies
  image: composer:latest
  script:
    - cd app
    - cp .env.example .env
    - composer install --no-interaction --prefer-dist --no-scripts
  artifacts:
    paths:
      - app/vendor/
      - app/.env
    expire_in: 1 hour

# Static Analysis with PHPStan
phpstan:
  stage: qa
  image: php:8.4-cli
  needs:
    - composer-install
  script:
    - cd app
    - vendor/bin/phpstan analyse --memory-limit=1G

# Code Style with PHP-CS-Fixer
php-cs-fixer:
  stage: qa
  image: php:8.4-cli
  needs:
    - composer-install
  script:
    - cd app
    - vendor/bin/php-cs-fixer check

# Unit Tests with PHPUnit
phpunit:
  stage: qa
  image: php:8.4-cli
  needs:
    - composer-install
  script:
    - cd app
    - bin/phpunit

# Architecture Validation with Deptrac
deptrac:
  stage: qa
  image: php:8.4-cli
  needs:
    - composer-install
  script:
    - cd app
    - vendor/bin/deptrac analyse --report-uncovered

build-image:
  stage: delivery
  image: docker:27
  services:
    - name: docker:27-dind
  needs:
    - phpstan
    - php-cs-fixer
    - phpunit
    - deptrac
  rules:
    # Push image only after merge (push pipeline) to master
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker buildx create --use
    - docker buildx build --platform "$IMAGE_PLATFORMS" -f build/Dockerfile.app -t "$IMAGE_NAME:$CI_COMMIT_SHA" -t "$IMAGE_NAME:latest" . --push

deploy:
  stage: delivery
  image: alpine:latest
  needs:
    - build-image
  rules:
    # Deploy only after merge (push pipeline) to master
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
  environment:
    name: production
    kubernetes:
      namespace: default
  timeout: 15 minutes
  before_script:
    - apk add --no-cache openssh-client bash curl tar
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - tar -czf /tmp/helm-chart.tgz helm/momentum
    - |
      scp /tmp/helm-chart.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/helm-chart.tgz"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash -lc 'set -euo pipefail
      tar -xzf /tmp/helm-chart.tgz -C /tmp
      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
      helm upgrade momentum /tmp/helm/momentum \
        --reuse-values \
        --set-string app.image=makomweb/momentum:$CI_COMMIT_SHA \
        --set-string app.pullPolicy=Always
      '"
