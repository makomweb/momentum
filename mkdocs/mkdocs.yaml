site_name: Momentum documentation
theme:
  name: material
  palette:
    primary: blue grey
    accent: light blue
markdown_extensions:
  - toc:
      toc_depth: 4
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: ./index.md
  - Architecture:
      - Overview: ./architecture/index.md
      - Deptrac Validation: ./architecture/deptrac.md
      - Design Patterns: ./architecture/patterns.md
      - Strava API Flow: ./architecture/strava-flow.md
