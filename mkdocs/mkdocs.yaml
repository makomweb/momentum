site_name: Momentum documentation
theme:
  name: material
  palette:
    primary: blue grey
    accent: light blue
markdown_extensions:
  - toc:
      toc_depth: 4
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: ./index.md
  - ⚙️ Architecture:
      - Overview: ./architecture/index.md
      - Deptrac Validation: ./architecture/deptrac.md
      - Design Patterns: ./architecture/patterns.md
      - Strava API Flow: ./architecture/strava-flow.md
  - 🚀 Operations:
      - Overview: ./operations/index.md
      - Deployment Guide: ./operations/deployment.md
      - Rate Limiting: ./operations/rate-limiting.md
  - 💻 Development:
      - Overview: ./development/index.md
      - Async Task Processing: ./development/async-tasks.md
  - 🧠 RAG:
      - Overview: ./rag/index.md
      - Features & Roadmap: ./rag/01-features-roadmap.md
      - OpenAI vs. Ollama: ./rag/02-provider-comparison.md
      - Smart Training Plans: ./rag/03-smart-training-plans.md
      - Vector Store Comparison: ./rag/04-vector-store-comparison.md
