site_name: Momentum documentation
theme:
  name: material
  palette:
    primary: blue grey
    accent: light blue
markdown_extensions:
  - toc:
      toc_depth: 4
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: ./index.md
  - Architecture: ./architecture/index.md
