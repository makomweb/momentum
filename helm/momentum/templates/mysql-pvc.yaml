apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "momentum.fullname" . }}-mysql-pvc
  labels:
    {{- include "momentum.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
