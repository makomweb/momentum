apiVersion: v1
kind: Service
metadata:
  name: {{ include "momentum.fullname" . }}-app
  labels:
    {{- include "momentum.labels" . | nindent 4 }}
spec:
  # Note: Hetzner K3s doesn't support LoadBalancer type natively.
  # In production with proper load balancer support, change to: type: LoadBalancer
  type: NodePort
  ports:
  - port: 80
    targetPort: {{ .Values.app.port }}
    protocol: TCP
    nodePort: 31228
  selector:
    {{- include "momentum.selectorLabels" . | nindent 4 }}
    app: app
