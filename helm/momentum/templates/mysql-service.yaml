apiVersion: v1
kind: Service
metadata:
  name: {{ include "momentum.fullname" . }}-mysql
  labels:
    {{- include "momentum.labels" . | nindent 4 }}
    app: mysql
spec:
  clusterIP: None
  ports:
  - port: {{ .Values.mysql.port }}
    targetPort: {{ .Values.mysql.port }}
    protocol: TCP
  selector:
    {{- include "momentum.selectorLabels" . | nindent 4 }}
    app: mysql
