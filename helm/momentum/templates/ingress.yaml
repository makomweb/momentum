{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "momentum.fullname" . }}-ingress
  labels:
    {{- include "momentum.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: {{ .Values.ingress.hostname | quote }}
    {{- if .Values.ingress.rewritePath }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "momentum.fullname" . }}-rewrite@kubernetescrd
    {{- end }}
spec:
  rules:
  - host: {{ .Values.ingress.hostname | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "momentum.fullname" . }}-app
            port:
              number: 80
  {{- range .Values.ingress.alternativeHostnames }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: {{ $.Values.ingress.path | quote }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "momentum.fullname" . }}-app
            port:
              number: 80
  {{- end }}
---
{{- if .Values.ingress.rewritePath }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "momentum.fullname" . }}-rewrite
  labels:
    {{- include "momentum.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
    - {{ .Values.ingress.path | quote }}
{{- end }}
{{- end }}
