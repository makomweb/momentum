apiVersion: v1
kind: Secret
metadata:
  name: {{ include "momentum.fullname" . }}-secret
  labels:
    {{- include "momentum.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "mysql://{{ .Values.mysql.user }}:{{ .Values.mysql.password }}@{{ include "momentum.fullname" . }}-mysql:{{ .Values.mysql.port }}/{{ .Values.mysql.database }}?serverVersion=8.4&charset=utf8mb4"
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
  MYSQL_PASSWORD: {{ .Values.mysql.password | quote }}
  STRAVA_CLIENT_ID: {{ .Values.strava.clientId | quote }}
  STRAVA_CLIENT_SECRET: {{ .Values.strava.clientSecret | quote }}
  STRAVA_REDIRECT_URI: {{ .Values.strava.redirectUri | quote }}
  APP_SECRET: {{ .Values.app.secret | quote }}
