apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-egress
  namespace: default
spec:
  podSelector: {}  # Applies to all pods in default namespace
  policyTypes:
  - Egress
  egress:
  # Allow DNS (required for external domain resolution)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
  # Allow external HTTPS (for Let's Encrypt, APIs, etc.)
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32  # Block AWS metadata (security best practice)
    ports:
    - protocol: TCP
      port: 443
  # Allow external HTTP
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
    ports:
    - protocol: TCP
      port: 80
