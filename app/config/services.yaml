# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.secret: '%env(APP_SECRET)%'
    app.version: '%env(APP_VERSION)%'
    strava_client_id: '%env(string:STRAVA_CLIENT_ID)%'
    strava_client_secret: '%env(string:STRAVA_CLIENT_SECRET)%'
    strava_redirect_uri: '%env(string:STRAVA_REDIRECT_URI)%'
    ollama_endpoint: '%env(string:OLLAMA_ENDPOINT)%'
    ollama_model: '%env(string:OLLAMA_MODEL)%'
    activity_stream_cache_dir: '%kernel.project_dir%/var'
    remember_me_lifetime: 2592000  # 30 days in seconds

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Inject the dedicated Strava token cache pool into TokenCache
    App\Strava\TokenCache:
        arguments:
            $pool: '@cache.strava_token'

    # FlySystem local filesystem adapter for activity stream cache
    activity_stream.filesystem:
        class: League\Flysystem\Filesystem
        arguments:
            - !service
              class: League\Flysystem\Local\LocalFilesystemAdapter
              arguments:
                - '%activity_stream_cache_dir%'

    # Inject FlySystem filesystem into ActivityStreamCache
    App\Strava\ActivityStreamCache:
        arguments:
            $filesystem: '@activity_stream.filesystem'

    # Inject Rate limiter factories into rate limiter listener
    App\Listener\RateLimiter:
        arguments:
            $limiterPerIp: '@limiter.per_ip'
            $limiterGlobalBurst: '@limiter.global_burst'

    # Expose app version to Twig templates
    App\Twig\GlobalVariables:
        arguments:
            $version: '%app.version%'
        tags:
            - { name: twig.extension }

    # Inject app secret to ActivityShareToken
    App\Momentum\ActivityShareToken:
        arguments:
            $appSecret: '%app.secret%'

    # Inject Ollama configuration into OllamaClient
    App\LLM\OllamaClient:
        arguments:
            $endpoint: '%ollama_endpoint%'
            $model: '%ollama_model%'

    # Make Client service public for testing
    App\Strava\API\Client:
        public: true
    App\Strava\API\TokenCacheInterface:
        alias: App\Strava\TokenCache

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        App\Strava\DebugTokenCache:
            arguments:
                $directory: '%kernel.project_dir%/var/debug_token_cache'
                $serializer: '@serializer'

        App\Strava\API\TokenCacheInterface:
            alias: App\Strava\DebugTokenCache

when@dev:
    services:
        App\Strava\DebugTokenCache:
            arguments:
                $directory: '%kernel.project_dir%/var/debug_token_cache'
                $serializer: '@serializer'

        App\Strava\API\TokenCacheInterface:
            alias: App\Strava\DebugTokenCache

