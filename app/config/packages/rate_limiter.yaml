framework:
    rate_limiter:
        per_ten_minutes:
            policy: 'fixed_window'
            limit: 100
            interval: '10 minutes'
        
        per_thirty_seconds:
            policy: 'token_bucket'
            limit: 100
            rate: { interval: '30 seconds', amount: 5 }
        
        per_ip:
            policy: 'compound'
            limiters: [per_ten_minutes, per_thirty_seconds]
        
        global_burst:
            policy: 'token_bucket'
            limit: 500
            rate:
                amount: 200
                interval: '1 minute'
