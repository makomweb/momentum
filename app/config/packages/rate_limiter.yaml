framework:
    rate_limiter:
        per_ten_minutes:
            policy: 'fixed_window'
            limit: 40
            interval: '10 minutes'
        per_thirty_seconds:
            policy: 'token_bucket'
            limit: 10
            rate:
                amount: 5
                interval: '30 seconds'
        general:
            policy: 'compound'
            limiters: [per_ten_minutes, per_thirty_seconds]
