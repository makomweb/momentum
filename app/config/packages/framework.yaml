# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks:
            - 'en'
    
    session:
        cookie_secure: '%env(bool:SECURE_COOKIE)%'
        cookie_httponly: true
        cookie_samesite: lax

when@test:
    framework:
        test: true
