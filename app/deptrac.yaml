deptrac:
  paths:
    - ./src
    - ./tests
  exclude_files: ~
    # - '#.*test.*#'
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: .*App\\Momentum\\.*
    - name: Generic
      collectors:
        - type: classLike
          value: .*Doctrine\\.*
        - type: classLike
          value: .*NeuronAI\\.*
        - type: classLike
          value: .*PHPUnit\\Framework\\.*
        - type: classLike
          value: .*Psr\\.*
        - type: classLike
          value: .*Symfony\\.*
        - type: bool
          must:
            - type: classLike
              value: .*Twig\\.*
          must_not:
            - type: classLike
              value: .*App\\Twig\\.*
        - type: classLike
          value: .*League\\Flysystem\\.*
    - name: Supporting
      collectors:
        - type: classLike
          value: .*App\\Async\\.*
        - type: classLike
          value: .*App\\AI\\.*
        - type: classLike
          value: .*App\\Command\\.*
        - type: classLike
          value: .*App\\Controller\\.*
        - type: classLike
          value: .*App\\Entity\\.*
        - type: classLike
          value: .*App\\Listener\\.*
        - type: classLike
          value: .*App\\Repository\\.*
        - type: classLike
          value: .*App\\Security\\.*
        - type: classLike
          value: .*App\\Strava\\.*
        - type: classLike
          value: .*App\\Twig\\.*
    - name: Tests
      collectors:
        - type: classLike
          value: .*App\\Tests\\.*
  ruleset:
    Core: ~
    Generic: ~
    Supporting:
      - Core
      - Generic
    Tests:
      - Core
      - Generic
      - Supporting
