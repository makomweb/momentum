deptrac:
  paths:
    - ./src
    - ./tests
  exclude_files: ~
    # - '#.*test.*#'
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: .*App\\RunForge\\.*
    - name: Generic
      collectors:
        - type: classLike
          value: .*PHPUnit\\Framework\\.*
        - type: classLike
          value: .*Psr\\.*
        - type: classLike
          value: .*Symfony\\.*
    - name: Supporting
      collectors:
        - type: classLike
          value: .*App\\Strava\\.*
    - name: Tests
      collectors:
        - type: classLike
          value: .*App\\Tests\\.*
  ruleset:
    Core: ~
    Generic: ~
    Supporting:
      - Core
      - Generic
    Tests:
      - Core
      - Generic
      - Supporting
